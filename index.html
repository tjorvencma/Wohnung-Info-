<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Wohnungsplaner</title><script>try{if(localStorage.getItem("wp-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F3EADA;color:#3D3225}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
#gate form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;background:#FFFBF3;padding:32px 28px;border-radius:24px;box-shadow:0 24px 48px -28px rgba(60,50,35,.35)}
#gate h1{margin:0 0 4px;font-size:1.8rem;font-family:'Fraunces',Georgia,serif;font-weight:600}
#gate input{font:inherit;color:inherit;padding:12px;border:1px solid #E2D6BF;border-radius:10px;background:#FFFBF3;text-align:center;letter-spacing:.3em}
#gate button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:#8B6A47;color:#fff;cursor:pointer}
#gate button:disabled{opacity:.6}#err{color:#A5472F;min-height:1.3em;font-size:.9rem}
.hello{margin:0 0 -2px;color:#7C6F5C;font-size:.98rem}
@keyframes gin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#gate form{animation:gin .6s cubic-bezier(.2,.7,.2,1) backwards}
@media (prefers-reduced-motion:reduce){#gate form{animation:none}}
:root[data-theme=dark]{color-scheme:dark}
:root[data-theme=dark] body{background:#16120D;color:#F2E8D5}
:root[data-theme=dark] #gate form{background:#211B14;box-shadow:0 24px 48px -28px rgba(0,0,0,.7)}
:root[data-theme=dark] #gate input{background:#16120D;border-color:#3A3024}
:root[data-theme=dark] #gate button{background:#D0A573;color:#1A130C}
:root[data-theme=dark] #err{color:#EE9A80}
:root[data-theme=dark] .hello{color:#B3A68F}</style></head><body>

function u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function kdf(pw,w){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(w.s),iterations:P.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  });
}
function unwrap(pw,w){return kdf(pw,w).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u(w.i)},k,u(w.d))}).then(function(x){return x},function(){return null});}
function dec(pw){
  return Promise.all([unwrap(pw,P.u),unwrap(pw,P.a)]).then(function(r){
    var raw=null,admin=null;
    if(r[0]){raw=r[0]}
    else if(r[1]){admin=JSON.parse(new TextDecoder().decode(r[1]));raw=u(admin.k)}
    if(!raw)throw new Error('pw');
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.m.i)},k,u(P.m.d))}).then(function(b){
      var o=JSON.parse(new TextDecoder().decode(b));o.admin=admin&&admin.js;return o;
    });
  });
}
function open(o){
  document.getElementById('gate').remove();
  var box=document.createElement('div');box.innerHTML=o.html;
  while(box.firstChild)document.body.appendChild(box.firstChild);
  if(o.admin)window.__WP_ADMIN=true;
  var s=document.createElement('script');s.textContent=o.js;document.body.appendChild(s);
  if(o.admin){var a=document.createElement('script');a.textContent=o.admin;document.body.appendChild(a);}
}
function tryPw(pw,quiet){
  var b=document.getElementById('gb'),er=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){er.textContent='Dieser Browser wird nicht unterstützt (HTTPS nötig).';return}
  b.disabled=true;er.textContent='';
  dec(pw).then(function(o){try{sessionStorage.setItem('wp-pw',pw)}catch(e){}open(o)},function(){
    try{sessionStorage.removeItem('wp-pw')}catch(e){}
    b.disabled=false;if(!quiet)er.textContent='Falsches Passwort.';
  });
}
document.getElementById('gf').addEventListener('submit',function(e){e.preventDefault();tryPw(document.getElementById('pw').value.trim())});
try{var sp=sessionStorage.getItem('wp-pw');if(sp)tryPw(sp,true)}catch(e){}
})();
