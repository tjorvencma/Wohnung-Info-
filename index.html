function u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function kdf(pw,w){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(w.s),iterations:P.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  });
}
function unwrap(pw,w){return kdf(pw,w).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u(w.i)},k,u(w.d))}).then(function(x){return x},function(){return null});}
function dec(pw){
  return Promise.all([unwrap(pw,P.u),unwrap(pw,P.a)]).then(function(r){
    var raw=null,admin=null;
    if(r[0]){raw=r[0]}
    else if(r[1]){admin=JSON.parse(new TextDecoder().decode(r[1]));raw=u(admin.k)}
    if(!raw)throw new Error('pw');
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.m.i)},k,u(P.m.d))}).then(function(b){
      var o=JSON.parse(new TextDecoder().decode(b));o.admin=admin&&admin.js;return o;
    });
  });
}
function open(o){
  document.getElementById('gate').remove();
  var box=document.createElement('div');box.innerHTML=o.html;
  while(box.firstChild)document.body.appendChild(box.firstChild);
  if(o.admin)window.__WP_ADMIN=true;
  var s=document.createElement('script');s.textContent=o.js;document.body.appendChild(s);
  if(o.admin){var a=document.createElement('script');a.textContent=o.admin;document.body.appendChild(a);}
}
function tryPw(pw,quiet){
  var b=document.getElementById('gb'),er=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){er.textContent='Dieser Browser wird nicht unterstützt (HTTPS nötig).';return}
  b.disabled=true;er.textContent='';
  dec(pw).then(function(o){try{sessionStorage.setItem('wp-pw',pw)}catch(e){}open(o)},function(){
    try{sessionStorage.removeItem('wp-pw')}catch(e){}
    b.disabled=false;if(!quiet)er.textContent='Falsches Passwort.';
  });
}
document.getElementById('gf').addEventListener('submit',function(e){e.preventDefault();tryPw(document.getElementById('pw').value.trim())});
try{var sp=sessionStorage.getItem('wp-pw');if(sp)tryPw(sp,true)}catch(e){}
})();
